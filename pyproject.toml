[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "design-os-origami-cad"
version = "0.1.0"
description = "Origami Mathematical Engineering & Parametric CAD Dieline Generator for Packaging Design"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jang", email = "jang@easeui.com" }
]
keywords = [
  "origami",
  "packaging",
  "cad",
  "dieline",
  "crease-pattern",
  "kinematic-folding",
  "threejs",
  "svg",
  "dxf"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]

[project.scripts]
origami-cad = "origami_cad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
